<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platformer - IG Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>

    <div id="controls-legend">
        <div style="margin-bottom: 10px; border-bottom: 1px solid #44aaff; padding-bottom: 5px;"><b>CONTROL SYSTEM</b></div>
        <span>[ W A S D ]</span> Movement<br>
        <span>[ Space ]</span> Jump<br>
        <span>[ E ]</span> Flashlight<br>
        <span>[ F ]</span> Interact<br>
        <span>[ Mouse ]</span> View
    </div>

    <div id="interaction-prompt">
        Press <b>[ F ]</b> to interact
    </div>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.150.0/examples/jsm/loaders/GLTFLoader.js",
        "@tweenjs/tween.js": "https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.esm.js"
      }
    }
  </script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
